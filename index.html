<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Compass — Sketch Tool</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="tool-group" id="drawing-tools">
      <button class="tool-btn active" data-tool="pencil" title="Pencil">
        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.996.996 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        <span>Pencil</span>
      </button>
      <button class="tool-btn" data-tool="eraser" title="Eraser">
        <svg viewBox="0 0 24 24"><path d="M16.24 3.56l4.2 4.2c.78.78.78 2.05 0 2.83L12 19.03 4.22 11.25a2 2 0 010-2.83l7.02-7.02a2 2 0 012.83 0l2.17 2.16zM6.34 10.66l6.36 6.36 2.12-2.12-6.36-6.36-2.12 2.12z"/></svg>
        <span>Eraser</span>
      </button>
      <button class="tool-btn" data-tool="line" title="Straight Line">
        <svg viewBox="0 0 24 24"><path d="M3 21L21 3l-1.5-1.5L1.5 19.5z"/></svg>
        <span>Line</span>
      </button>
    </div>

    <div class="tool-group" id="instrument-tools">
      <button class="tool-btn" data-tool="ruler" title="Ruler">
        <svg viewBox="0 0 24 24"><path d="M20.13 3.87a2 2 0 00-2.83 0L2.87 18.3a2 2 0 000 2.83A2 2 0 004.3 21.7L18.7 7.3a2 2 0 000-2.83l-1.43-1.6zM4.7 19.3L6 18l1 1-1.4 1.4-.9-.9v-.2zM7.4 16.6L8.7 15.3l1 1L8.3 17.6l-.9-1zM10.1 13.9l1.3-1.3 1 1-1.3 1.3-1-1zM12.8 11.2l1.3-1.3 1 1-1.3 1.3-1-1zM15.5 8.5l1.3-1.3 1 1-1.3 1.3-1-1z"/></svg>
        <span>Ruler</span>
      </button>
      <button class="tool-btn" data-tool="protractor" title="Protractor">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 00-10 10h2a8 8 0 0116 0h2A10 10 0 0012 2zm0 3a7 7 0 00-7 7h1.4A5.6 5.6 0 0112 6.4 5.6 5.6 0 0117.6 12H19a7 7 0 00-7-7zm0 9a2 2 0 100-4 2 2 0 000 4z"/></svg>
        <span>Protractor</span>
      </button>
      <button class="tool-btn" data-tool="compass" title="Compass">
        <svg viewBox="0 0 24 24"><path d="M12 2l1.8 3.6a5 5 0 11-3.6 0L12 2zm0 5a3 3 0 100 6 3 3 0 000-6zm-1 8l-6 9h2.4l4-6 4 6H18l-6-9h-1z"/></svg>
        <span>Compass</span>
      </button>
      <button class="tool-btn" data-tool="image" title="Image">
        <svg viewBox="0 0 24 24"><path d="M19 5v14H5V5h14zm0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        <span>Image</span>
      </button>
    </div>

    <div class="tool-group" id="compass-context">
      <button id="lockBtn" class="icon-btn" title="Lock the compass opening">
        <svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 00-5 5v3H6a2 2 0 00-2 2v9a2 2 0 002 2h12a2 2 0 002-2v-9a2 2 0 00-2-2h-1V6a5 5 0 00-5-5zm0 2a3 3 0 013 3v3H9V6a3 3 0 013-3z"/></svg>
        <span id="lockBtnLabel">Lock</span>
      </button>
    </div>

    <div class="tool-group" id="image-context">
      <button id="addImageBtn" class="icon-btn" title="Add an image">
        <svg viewBox="0 0 24 24"><path d="M19 5v14H5V5h14zm0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        <span>Add Image</span>
      </button>
      <button id="cropBtn" class="icon-btn" title="Crop the selected image">
        <svg viewBox="0 0 24 24"><path d="M7 17V1H5v4H1v2h4v10a2 2 0 002 2h10v4h2v-4h4v-2H7zm2-8h6v6h2V9a2 2 0 00-2-2H9v2z"/></svg>
        <span id="cropBtnLabel">Crop</span>
      </button>
      <button id="deleteImageBtn" class="icon-btn" title="Delete the selected image">
        <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13a2 2 0 01-2 2H9a2 2 0 01-2-2L6 7zm3-3h6l1 2H8l1-2z"/></svg>
        <span>Delete</span>
      </button>
      <input type="file" id="imageFileInput" accept="image/*" hidden>
    </div>

    <div class="tool-group" id="style-controls">
      <label class="control">
        <span>Color</span>
        <input type="color" id="colorPicker" value="#1e293b">
      </label>
      <label class="control">
        <span>Width</span>
        <input type="range" id="widthPicker" min="1" max="20" value="3">
        <span id="widthValue">3</span>
      </label>
    </div>

    <div class="tool-group" id="action-controls">
      <button id="undoBtn" class="icon-btn" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62A7.49 7.49 0 0112.5 10c3.03 0 5.6 1.98 6.48 4.72l2.37-.77C20.15 10.42 16.72 8 12.5 8z"/></svg>
        <span>Undo</span>
      </button>
      <button id="clearBtn" class="icon-btn" title="Clear canvas">
        <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13a2 2 0 01-2 2H9a2 2 0 01-2-2L6 7zm3-3h6l1 2H8l1-2z"/></svg>
        <span>Clear</span>
      </button>
    </div>
  </header>

  <div id="hint-bar"><span id="hintText">Pencil selected — draw freely on the canvas.</span></div>

  <main id="canvas-container">
    <canvas id="drawCanvas"></canvas>
    <canvas id="overlayCanvas"></canvas>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
